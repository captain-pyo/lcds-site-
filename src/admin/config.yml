# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: captain-pyo/lcds-site-
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/e21f73ed-9946-4f65-a794-0fc8605feaaa/pkce
  auth_token_endpoint: /sites/e21f73ed-9946-4f65-a794-0fc8605feaaa/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://lcds-life-career.netlify.app

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

publish_mode: simple
locale: "ko"

collections:
  - name: "notices"
    label: "공지사항"
    label_singular: "글"
    folder: "src/notices"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "날짜", name: "date", widget: "datetime" }
      - { label: "요약(목록에 짧게 보일 문구)", name: "summary", widget: "text", required: false }
      - { label: "본문", name: "body", widget: "markdown" }

  - name: "gallery"
    label: "사진 갤러리 (소개 페이지)"
    label_singular: "사진"
    folder: "src/_data/gallery"
    create: true
    extension: "yml"
    format: "yml"
    fields:
      - { label: "사진", name: "image", widget: "image" }
      - { label: "코멘트", name: "caption", widget: "string" }

  - name: "publications"
    label: "저작물"
    label_singular: "저작물"
    folder: "src/_data/publications"
    create: true
    extension: "yml"
    format: "yml"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "연도", name: "year", widget: "string", required: false }
      - { label: "출판사", name: "publisher", widget: "string", required: false }
      - { label: "소개", name: "desc", widget: "text" }
      - { label: "링크(선택)", name: "link", widget: "string", required: false }
      - { label: "표지 이미지(선택)", name: "cover", widget: "image", required: false }

  - name: "testimonials"
    label: "클라이언트 후기"
    label_singular: "후기"
    folder: "src/_data/testimonials"
    create: true
    extension: "yml"
    format: "yml"
    fields:
      - { label: "과정/서비스명", name: "course", widget: "string", hint: "예: 생애경력설계사 14기, 1:1 전직지원 컨설팅" }
      - { label: "후기 내용", name: "quote", widget: "text" }

  - name: "settings"
    label: "사이트 설정"
    editor: { preview: false }
    files:
      - name: "about"
        label: "소개 페이지"
        file: "src/_data/about.json"
        fields:
          - { label: "미션", name: "mission", widget: "text" }
          - { label: "홈 화면 우측 사진(선택, 비워두면 나침반이 표시됨)", name: "hero_image", widget: "image", required: false }
          - { label: "비전", name: "vision", widget: "text" }
          - { label: "프로필 사진", name: "profile_image", widget: "image" }
          - { label: "소개 제목", name: "bio_title", widget: "string" }
          - { label: "소개 요약", name: "bio_summary", widget: "text" }
          - label: "약력/자격"
            name: "credentials"
            widget: "list"
            field: { label: "항목", name: "item", widget: "string" }
          - label: "철학 (도전/협업/신뢰)"
            name: "philosophy"
            widget: "list"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "영문", name: "en", widget: "string" }
              - { label: "설명", name: "desc", widget: "text" }
          - label: "항해 기록 (경력 타임라인)"
            name: "voyage"
            widget: "list"
            fields:
              - { label: "시기", name: "period", widget: "string" }
              - { label: "설명", name: "desc", widget: "text" }
          - label: "출강/협력 기관"
            name: "partner_orgs"
            widget: "list"
            field: { label: "기관명", name: "org", widget: "string" }

      - name: "programs"
        label: "프로그램 페이지"
        file: "src/_data/programs.json"
        fields:
          - { label: "소개 문구", name: "intro", widget: "text" }
          - label: "디자인씽킹 단계"
            name: "design_thinking"
            widget: "list"
            fields:
              - { label: "단계명", name: "step", widget: "string" }
              - { label: "영문", name: "en", widget: "string" }
              - { label: "설명", name: "desc", widget: "string" }
          - label: "차별성 키워드"
            name: "differentiators"
            widget: "list"
            fields:
              - { label: "용어", name: "term", widget: "string" }
              - { label: "한자", name: "hanja", widget: "string" }
              - { label: "설명", name: "desc", widget: "string" }
          - label: "등록민간자격 과정"
            name: "certifications"
            widget: "list"
            fields:
              - { label: "과정명(국문)", name: "name_kr", widget: "string" }
              - { label: "과정명(영문)", name: "name_en", widget: "string" }
              - { label: "급수", name: "level", widget: "string" }
              - { label: "등록번호", name: "reg_no", widget: "string" }
              - { label: "설명", name: "desc", widget: "text" }
              - { label: "배출 기수", name: "cohorts", widget: "string" }
          - label: "수료증 과정 (일반)"
            name: "certificate_courses"
            widget: "list"
            fields:
              - { label: "과정명(국문)", name: "name_kr", widget: "string" }
              - { label: "과정명(영문)", name: "name_en", widget: "string" }
              - { label: "설명", name: "desc", widget: "text" }
              - { label: "배출 기수", name: "cohorts", widget: "string" }

      - name: "contact"
        label: "문의/연락처"
        file: "src/_data/contact.json"
        fields:
          - { label: "이메일", name: "email", widget: "string" }
          - { label: "전화번호", name: "phone", widget: "string" }
          - { label: "블로그 URL", name: "blog", widget: "string" }
          - { label: "페이스북 URL", name: "facebook", widget: "string" }
          - { label: "유튜브 URL", name: "youtube", widget: "string" }
          - { label: "밴드명", name: "band", widget: "string" }
