title: 라이프 앤 커리어 디자인 캔버스(개인의 성찰 및 자각을 위한 A2지 도구)
year: 2019년
publisher: 라이프 앤 커리어 디자인 스쿨
desc: >-
  라이프 앤 커리어 디자인 캔버스는 3종으로 '라이프 라인 캔버스', '라이프 휠 캔버스', 그리고 '뉴 커리어 캔버스'이다. 이는 개인이
  자신의 삶에 대한 공감 및 이해하고, 자신이 지닌 문제를 정의하며, 대안이나 해결책을 탐색 및 수립하여, 실행할 원형을 만든 이후에 시험하고
  환류하는 '디자인 씽킹(Design Thinking)' 개념에 기반한다. 그를 통해서 개인은 '자각 - 자성 - 자행 - 자득'의 프로세스를
  거치면서 한 단계 발전한다.

  각 캔버스의 특징은 아래와 같다.
    ㅇ 라이프 라인 캔버스 : 과거, 현재, 미래 삶의 만족도 그려보기, 영역별 주요 이벤트 작성, 자신의 느낌 작성
    ㅇ 라이프 휠 캔버스 : 삶의 주요 영역 상황 및 바램 측정, 삶의 목표 세우기
    ㅇ 뉴 커리어 캔버스 : 개인이 몰입하는 주제를 통해서 가능성있는 새로운 일 찾아보기.

  각 캔버스는 작성에 40-50분 정도 소요되며, 작성, 성찰, 공유 등을 통해서 자신을 이해하게 된다.
