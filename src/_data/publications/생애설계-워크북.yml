title: 생애설계 워크북
year: "2018년 "
publisher: 생각나눔
desc: >-
  생애설계 워크북은 자신의 삶을 기회가 아닌 선택에 의해 살 수 있도록 도와주는 도구입니다. 이 워크북은 과거의 자신과 현재 자신이 지향하는
  바를 파악한 후 목표에 도달할 수 있는 구체적이면서도 현실적인 계획을 디자인하는 기능과 현재 자신의 위치를 구체적으로 탐색하도록 도와줍니다.
  다른 모든 도구들이 그러하듯이, 자시니 직접 해볼 경우에 도움을 받을 수 있는 도구입니다.

  원하는 생애의 설계와 그 생애가 잘 작동되도록 하는 자신의 책임은 계속 진행형으로 남아있습니다. 아마도 그런 발전의 마지막 단계에 도달해보면 자신이 한층 성숙한 성인이 되어있다는 점을 느끼게 될 것입니다. 누군가가 자신을 돌보아 줄 것이라는 생각 아래 모든 것이 잘될 것이라던 어린 시절의 동경은 버린다는 의미입니다. 즉, 삶은 자신이 만들어야 한다는 현실을 수용하는 것입니다.
link: https://product.kyobobook.co.kr/detail/S000001012570
