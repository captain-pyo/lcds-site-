title: 전직지원 전문가 가이드북
year: 2016년
publisher: 생각나눔
desc: >-
  전직지원서비스는 미국뿐만 아니라 국제적으로 성장하고 있는 중요한 전문서비스이다. 일반적 용어로 정의해보면 전직지원 서비스는 실직한 근로자의
  효과적인 경력개발과 구직을 지원하는 일종의 프로세스이다. 지난 15여 년 동안 미국 내에 있는 여러 가지 주요 산업에서 연간 약 40만여
  명이라는 엄청난 숫자의 근로자들을 해고하면서 전직지원 서비스에 대한 요구는 급격히 증대되었다.

  전직지원 서비스는 경영자들이 겪는 비즈니스와 관련된 일련의 도전에 대응하도록 지원하는 유용하고도 실질적인 수단으로 인식되고 있다. 이 분야의 급속한 팽창에 따라서 현재 전직지원에 가용한 지식과 정보의 실체를 수집, 조직, 그리고 명확화하려는 요구도 증대되었다. 본 저서는 전직지원과 관련된 광범한 주제들을 최신화하여 권위있는 정보를 제공하기 위한 목적으로 저작하였다. 
link: https://product.kyobobook.co.kr/detail/S000001012485
