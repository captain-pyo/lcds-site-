title: 한국형 전직지원 기술
year: 2024년
publisher: 생각나눔
desc: >-
  ‘한국형 전직지원 기술’은 전직지원 분야의 새로운 지평을 여는 책입니다. 이 책은 권정봉, 문승희, 장양숙, 표성일(공동저자 대표) 등 네
  명의 전직지원 전문가들이 공동 저술한 작품으로, 전직지원 서비스의 이해부터 전직컨설팅 스킬, 프로그램 계획 및 운영, 마케팅 및 행정,
  그리고 미래 발전 지향점까지 폭넓은 내용을 다루고 있습니다.

  이 책의 가장 큰 특징은 '재취업’에 국한되지 않고, 직업이나 직무를 옮기는 '전직’의 개념을 중심으로 한다는 점입니다. 특히, 장기간 근무 후 퇴직한 40대 이상의 중장년층을 대상으로 한 현장 중심의 전직지원 방법론을 제시하고 있어, 고령화 시대에 더욱 중요한 생애경력설계에 대한 내용을 포함하고 있습니다.

  또한, 이 책은 다음과 같은 특별한 점과 차별성을 가지고 있습니다:

  • 전직지원 경과: 전직지원의 전반적인 과정을 상세히 설명하여 독자들이 쉽게 이해할 수 있도록 돕습니다.

  • 학술적 컨설팅 이론과 경험적 컨설팅 이론의 결합: 이론과 실무를 결합하여 보다 실질적인 전직지원 방법론을 제시합니다.

  • 프레임워크 및 콘텐츠 모듈의 표준 제시: 전직지원 프로그램을 체계적으로 계획하고 운영할 수 있는 표준 프레임워크와 콘텐츠 모듈을 제공합니다.

  • 생각정리 및 생각확장 기반 제공: 독자들이 자신의 생각을 정리하고 확장할 수 있는 도구와 방법을 제시합니다.

  • 다양한 현장 사례 및 예제 제시: 실제 현장에서 적용할 수 있는 다양한 사례와 예제를 통해 실무 능력을 향상시킵니다.

  • 다양한 그림과 표를 통한 독자 이해 향상: 시각적 자료를 활용하여 독자들의 이해를 돕습니다.

  • 생성형 AI의 전직지원 활용: 최신 기술을 활용한 전직지원 방법론을 소개하여 미래 지향적인 접근을 제시합니다.

  이 책은 전직지원 분야에서 일하는 컨설턴트, 카운슬러, 코치뿐만 아니라, 관련 공공 기관 및 일반 기업의 HR 담당자, 정책 수립 담당자들에게도 유용한 참고서가 될 것입니다. 전체적인 개념과 세부 사항을 상황이나 절차에 맞게 잘 수록해두어, 필요할 때마다 참고할 수 있는 매뉴얼로서의 역할을 할 것입니다. ‘한국형 전직지원 기술’은 전직지원의 새로운 패러다임을 제시하며, 중장년층의 성공적인 전직을 돕는 데 큰 기여를 할 것입니다. 이 책은 전직지원 분야의 전문가들이 오랜 경험과 연구를 바탕으로 집필한 만큼, 독자들에게 실질적인 도움을 줄 수 있을 것입니다.
