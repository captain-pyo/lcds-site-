title: 전직지원 2030년
year: 2020년
publisher: 생각나눔
desc: >
  2006년부터 어떠한 방법으로든 '전직지원', '재취업', '퇴직지원' 그리고 강사 등의 업무를 경험한 관계로 현장의 취업알선원,
  직업상담사, 그리고 전직지원 컨설턴트가 참고할 수 있는 '전직지원 2030년'이라는 책을 공동저작하였습니다.  이 책으로 끝내세요...

        ㅇ 이 책에서는 적어도 대한민국에서 누구도 정리하지 않았던 내용과 다수 사례를 제시하고 있습니다.  사례는 외국의 간단한 노하우도 여러개 실어놓았습니다.   

        ㅇ 더불어 누구도 정리하지 않았던 새로운 내용과 이야기를 많이 하고 있습니다.

        ㅇ 아직도 구태의연한 '재취업'이라는, 인터넷 치면 나오는, 일반적인 내용을 탈피한 책입니다.

        ㅇ 확실한 방향을 제시합니다.  구태의연한 이야기는 없습니다...
