title: 긱 경제와 1인 지식기업
year: 2021년
publisher: 유페이퍼
desc: "우리가 모르는 사이에, 아니 인식하는 가운데 세상은 급변하고 있다. 이전의 4차 산업혁명, 인공지능, 가상현실 그리고 증강현실 등에
  이어서 요즈음은 생성형 AI가 화두이다. 일의 세계에서도 그런 변화가 영향을 미친다. 모두가 원하는 바는 보수가 많은 정규직 일자리에
  진입해서 안정되게, 그리고 오래동안 일하는 것이다. 그러나 현실세계에서는 바라는 바와 달리 안정된 일자리가 아닌 여러 가지 형태의 일거리들만
  주로 보인다. 이런 시기에 일거리의 변화상황을 살펴보는 가운데, 다수가 희망하는 출구 중에서도 기존의 지식을 활용하거나, 새로이 정비하여
  용이하게 할 수 있는 1인지식기업을 고려해보는 것은 매우 의미가 있다. 미래세계는 안정된 일자리라기 보다는 하나의 일자리 혹은 여러 개의
  소수점 일거리를 엮어서 하나의 일자리를 만드는 형태나 자신이 자신을 고용하는 1인기업이 대세가 될 것이기 때문이다. "
link: https://ebook-product.kyobobook.co.kr/dig/epd/ebook/E000002957906
