title: 중장년 생애경력설계 노하우
year: 2024년
publisher: 생각나눔
desc: 100세 시대, 그리고 조만간에 우리 앞에 성큼 다가올 120세 시대에 중장년이 이전 생각으로 삶이나, 경력에 접근한다면, 인생
  후반에서 어려움을 겪을 수 있다. 본 저서는 불확실한 미래에 중장년이 겪을 수 있는 다양한 삶과 일의 세파를 잘 헤쳐나갈 수 있도록 지원하기
  위한 목적으로 저작하였다. 아울러 현장에서 미래 설계를 묵묵히 지원하고 있는 컨설턴트, 카운슬러 및 코치들의 질적 업무를 지원할 목적도
  가지고 저작하였다. 본 저서의 내용은 기본적으로 중장년을 대상으로 하지만, 일부 노하우와 기법들은 '생애경력설계'가 필요한 모든 계층,
  연령층에 전환하여 활용할 수 있다.
